<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .box { fill: #17171b; stroke: #34343d; stroke-width: 1; rx: 10; }
      .accent { fill: #17171b; stroke: #6656d1; stroke-width: 1.2; rx: 10; }
      .label { fill: #e8e8ec; font-size: 13px; font-weight: 600; }
      .sub { fill: #9a9aa5; font-size: 11px; }
      .arrow { stroke: #45454f; stroke-width: 1.6; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#45454f" />
    </marker>
  </defs>
  <rect width="900" height="460" fill="#0a0a0c" />

  <rect x="40" y="30" width="200" height="60" class="box" />
  <text x="140" y="55" text-anchor="middle" class="label">Project Folder</text>
  <text x="140" y="72" text-anchor="middle" class="sub">local dir or GitHub repo</text>

  <rect x="40" y="130" width="200" height="60" class="accent" />
  <text x="140" y="155" text-anchor="middle" class="label">Repository Analyzer</text>
  <text x="140" y="172" text-anchor="middle" class="sub">packages/core/analyzer</text>

  <rect x="40" y="230" width="200" height="60" class="box" />
  <text x="140" y="255" text-anchor="middle" class="label">ProjectInfo</text>
  <text x="140" y="272" text-anchor="middle" class="sub">structured, secret-free JSON</text>

  <rect x="330" y="230" width="220" height="60" class="accent" />
  <text x="440" y="255" text-anchor="middle" class="label">AI Provider (optional)</text>
  <text x="440" y="272" text-anchor="middle" class="sub">None / Ollama / OpenAI / Anthropic / Custom</text>

  <rect x="40" y="330" width="200" height="60" class="box" />
  <text x="140" y="355" text-anchor="middle" class="label">README Generator</text>
  <text x="140" y="372" text-anchor="middle" class="sub">deterministic + AI-assisted</text>

  <rect x="330" y="330" width="220" height="60" class="box" />
  <text x="440" y="355" text-anchor="middle" class="label">Quality Scorer</text>
  <text x="440" y="372" text-anchor="middle" class="sub">packages/core/quality</text>

  <rect x="630" y="230" width="220" height="60" class="box" />
  <text x="740" y="255" text-anchor="middle" class="label">GitHub-style Preview</text>
  <text x="740" y="272" text-anchor="middle" class="sub">react-markdown + github-markdown-css</text>

  <rect x="630" y="330" width="220" height="60" class="accent" />
  <text x="740" y="355" text-anchor="middle" class="label">Export</text>
  <text x="740" y="372" text-anchor="middle" class="sub">copy · download · save to project</text>

  <path class="arrow" d="M140,90 L140,130" />
  <path class="arrow" d="M140,190 L140,230" />
  <path class="arrow" d="M240,260 L330,260" />
  <path class="arrow" d="M140,290 L140,330" />
  <path class="arrow" d="M440,290 L440,330" />
  <path class="arrow" d="M240,360 L330,360" />
  <path class="arrow" d="M550,360 L630,360" />
  <path class="arrow" d="M550,260 L630,260" />
  <path class="arrow" d="M740,290 L740,330" />
</svg>
